# Builds a Windows x64 copy of BetterMoonscraper and publishes it as a GitHub release,
# so testers can download it without installing Unity.
#
# master        -> release "latest-build"
# other branch  -> release "build-<branch>" (e.g. build-duet-phase-0)
#
# Needs repository secrets UNITY_LICENSE (contents of Unity_lic.ulf), UNITY_EMAIL and UNITY_PASSWORD.

name: Windows build

on:
  push:
    branches: [master, 'duet/**']
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: Moonscraper Chart Editor
  ZIP_NAME: BetterMoonscraper-Windows-x64.zip

jobs:
  build:
    name: Build with Unity
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # Reading a draft release needs write access
    steps:
      - name: Check Unity secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -z "$UNITY_LICENSE" ] && missing="$missing UNITY_LICENSE"
          [ -z "$UNITY_EMAIL" ] && missing="$missing UNITY_EMAIL"
          [ -z "$UNITY_PASSWORD" ] && missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - uses: actions/checkout@v4

      # The build runs in a Linux editor, which still compiles UNITY_STANDALONE_WIN code,
      # but the managed Windows DLLs are only enabled for the Windows editor. In this
      # checkout only, enable them for any editor OS, and swap the Linux Bass.Net wrapper
      # (which lacks the Windows-only EncoderOGG) for the Windows x64 one.
      - name: Use Windows managed plugins in the Linux editor
        run: |
          plugins="$PROJECT_PATH/Assets/Plugins"
          sed -i 's/OS: Windows$/OS: AnyOS/' \
            "$plugins/Native File Explorer/Windows/System.Windows.Forms.dll.meta" \
            "$plugins/Native File Explorer/Windows/Ookii.Dialogs.dll.meta" \
            "$plugins/Bass Audio/Windows/x64/Bass.Net.dll.meta"
          python3 - "$plugins/Bass Audio/Linux/Bass.Net.Linux.dll.meta" <<'PY'
          import sys
          path = sys.argv[1]
          text = open(path).read()
          old = "      Editor: Editor\n    second:\n      enabled: 1\n"
          assert old in text, "Bass.Net.Linux editor entry not found"
          open(path, "w").write(text.replace(old, old.replace("enabled: 1", "enabled: 0")))
          PY
          git diff

      - name: Cache Unity Library folder
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-win64-${{ hashFiles('Moonscraper Chart Editor/Assets/**', 'Moonscraper Chart Editor/Packages/**', 'Moonscraper Chart Editor/ProjectSettings/**') }}
          restore-keys: Library-win64-

      # Duet Mode room codes use Epic Online Services. Epic's SDK can't go in this public repo, so it's kept as
      # eos-sdk-ci.zip in a draft release named eos-sdk-private, which only people with write access can see.
      # The keys come from the EOS_* secrets. Without either, the build only offers Direct IP.
      - name: Add Epic Online Services for room codes
        env:
          GH_TOKEN: ${{ github.token }}
          EOS_PRODUCT_ID: ${{ secrets.EOS_PRODUCT_ID }}
          EOS_SANDBOX_ID: ${{ secrets.EOS_SANDBOX_ID }}
          EOS_DEPLOYMENT_ID: ${{ secrets.EOS_DEPLOYMENT_ID }}
          EOS_CLIENT_ID: ${{ secrets.EOS_CLIENT_ID }}
          EOS_CLIENT_SECRET: ${{ secrets.EOS_CLIENT_SECRET }}
        run: |
          asset=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft and .tag_name == "eos-sdk-private") | .assets[] | select(.name == "eos-sdk-ci.zip") | .id' | head -n 1)
          if [ -z "$asset" ]; then
            echo "::warning::No eos-sdk-ci.zip in an eos-sdk-private draft release, so this build has no room codes"
            exit 0
          fi
          if [ -z "$EOS_PRODUCT_ID" ] || [ -z "$EOS_SANDBOX_ID" ] || [ -z "$EOS_DEPLOYMENT_ID" ] || [ -z "$EOS_CLIENT_ID" ] || [ -z "$EOS_CLIENT_SECRET" ]; then
            echo "::warning::Missing EOS_* secrets, so this build has no room codes"
            exit 0
          fi

          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "$RUNNER_TEMP/eos-sdk-ci.zip"
          unzip -q -o "$RUNNER_TEMP/eos-sdk-ci.zip" -d "$PROJECT_PATH"
          # The zip keeps its maker's private file modes; make the files readable so the build can be uploaded
          (cd "$PROJECT_PATH" && unzip -Z1 "$RUNNER_TEMP/eos-sdk-ci.zip" | tr '\n' '\0' | xargs -0 chmod a+rX)
          test -f "$PROJECT_PATH/EOS/EOSSDK-Win64-Shipping.dll"
          test -d "$PROJECT_PATH/Assets/Plugins/EOS/Source"

          # Compile the keys into the game, masked with fresh random bytes each build, instead of shipping credentials.txt
          python3 - "$PROJECT_PATH/Assets/Scripts/Game/Collaboration/Eos/DuetEosKeys.cs" <<'PY'
          import os, sys
          names = ["EOS_PRODUCT_ID", "EOS_SANDBOX_ID", "EOS_DEPLOYMENT_ID", "EOS_CLIENT_ID", "EOS_CLIENT_SECRET"]
          mask = os.urandom(61)
          def masked(n, text):
              data = text.encode("ascii")
              return ", ".join(str(b ^ mask[(i + n * 7) % len(mask)]) for i, b in enumerate(data))
          rows = ",\n        ".join("new byte[] { %s }" % masked(n, os.environ[name]) for n, name in enumerate(names))
          with open(sys.argv[1], "w") as f:
              f.write("// Made by the GitHub build, never committed\n#if DUET_EOS && DUET_EOS_EMBEDDED\n")
              f.write("static class DuetEosKeys\n{\n")
              f.write("    public static readonly byte[] Mask = { %s };\n" % ", ".join(str(b) for b in mask))
              f.write("    public static readonly byte[][] Values =\n    {\n        %s\n    };\n}\n#endif\n" % rows)
          PY
          printf -- '-define:DUET_EOS\n-define:EOS_DYNAMIC_BINDINGS\n-define:DUET_EOS_EMBEDDED\n' > "$PROJECT_PATH/Assets/csc.rsp"
          rm -f "$PROJECT_PATH/EOS/credentials.txt"
          echo "Room codes enabled"

      # Lets Collab Mode tell people when they're on different builds
      - name: Stamp the build with its commit
        run: echo "$GITHUB_SHA" > "$PROJECT_PATH/Assets/Resources/BuildId.txt"

      - name: Build Windows x64
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2018.4.23f1
          targetPlatform: StandaloneWindows64
          projectPath: ${{ env.PROJECT_PATH }}
          buildMethod: BuildManager.BuildWindows64CI
          customParameters: -moonscraperBuildPath /github/workspace/ci-build
          versioning: None
          allowDirtyBuild: true

      # The Unity container writes the build as root, keeping the source files' modes
      - name: Make the build readable
        run: sudo chmod -R a+rX ci-build

      - name: Upload unpatched build
        uses: actions/upload-artifact@v4
        with:
          name: unpatched-build
          path: ci-build/
          retention-days: 1

  publish:
    name: Patch and publish
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UnityApplicationPatcher-1.0.6-Win
            Moonscraper Chart Editor/ProjectSettings

      - uses: actions/download-artifact@v4
        with:
          name: unpatched-build
          path: ci-build

      # Same security patch BuildManager applies to local Windows builds
      - name: Apply Unity security patch
        shell: pwsh
        run: |
          $app = Get-ChildItem ci-build -Directory | Select-Object -First 1
          $patcher = Resolve-Path "UnityApplicationPatcher-1.0.6-Win/UnityApplicationPatcherCLI.exe"
          & $patcher -windows -applicationPath "$($app.FullName)"
          # 0 = patched, 183 = already patched
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 183) { throw "Patcher failed with exit code $LASTEXITCODE" }
          Compress-Archive -Path "$($app.FullName)" -DestinationPath $env:ZIP_NAME
          "APP_FOLDER=$($app.Name)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterMoonscraper-Windows-x64
          path: ${{ env.ZIP_NAME }}

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $branch = "${{ github.ref_name }}"
          $tag = if ($branch -eq "master") { "latest-build" } else { "build-" + ($branch -replace '[^A-Za-z0-9._-]', '-') }
          $sha = "${{ github.sha }}"
          $short = $sha.Substring(0, 7)
          $notes = @"
          Automatic Windows build of ``$branch`` at $short (run #${{ github.run_number }}).

          Download **$env:ZIP_NAME**, unzip it, and run ``BetterMoonscraper.exe`` inside the ``$env:APP_FOLDER`` folder. No Unity install needed.
          "@
          gh release delete $tag --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create $tag $env:ZIP_NAME --target $sha --prerelease --title "Windows build: $branch ($short)" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          "Download: ${{ github.server_url }}/${{ github.repository }}/releases/download/$tag/$env:ZIP_NAME" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # The in-app updater (Help > Updates) only looks at full releases named after a version, such as v1.0.1.
      # Raising bundleVersion in ProjectSettings and pushing to master makes one, once per version.
      - name: Publish version release
        if: github.ref_name == 'master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $line = Select-String -Path "Moonscraper Chart Editor/ProjectSettings/ProjectSettings.asset" -Pattern '^\s*bundleVersion:\s*(\S+)' | Select-Object -First 1
          if (-not $line) { throw "No bundleVersion in ProjectSettings.asset" }
          $version = $line.Matches[0].Groups[1].Value
          $tag = "v$version"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { "$tag already released, nothing to do"; $global:LASTEXITCODE = 0; exit 0 }
          $global:LASTEXITCODE = 0
          $notes = @"
          BetterMoonscraper $tag.

          Download **$env:ZIP_NAME**, unzip it, and run ``BetterMoonscraper.exe`` inside the ``$env:APP_FOLDER`` folder. Already have it? Help > Updates installs this version for you.
          "@
          gh release create $tag $env:ZIP_NAME --target "${{ github.sha }}" --latest --title "BetterMoonscraper $tag" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          "Version release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
